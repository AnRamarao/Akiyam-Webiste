<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Reset Password – AIKYAM</title>
  <meta name="title" content="Reset Password – AIKYAM" />
  <meta name="description" content="Set a new password for your AIKYAM account." />
  <meta name="robots" content="noindex, nofollow" />

  <link rel="icon" type="image/png" href="assets/branding/logo.png" />
  <link rel="apple-touch-icon" href="assets/branding/logo.png" />

  <!-- Content Security Policy -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co;" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="tricolor" aria-hidden="true"></div>

  <div id="bg-zoom" aria-hidden="true">
    <picture>
      <source type="image/webp" srcset="assets/branding/BgImage-1200.webp 1200w, assets/branding/BgImage.webp 1920w">
      <img id="bgZoomImg" src="assets/branding/BgImage.png" alt="AIKYAM community background">
    </picture>
  </div>

  <div id="header-placeholder"></div>

  <main id="main-content" class="login-page">
    <div class="login-card reveal">

      <div class="login-card__logo">
        <img src="assets/branding/logo.png" alt="AIKYAM Logo" width="72" height="72">
      </div>

      <h1 class="login-card__title">Reset Password</h1>
      <p class="login-card__subtitle">Enter your new password below</p>

      <form class="login-form" id="resetPasswordForm" novalidate>
        <div class="login-form__group">
          <label class="login-form__label" for="newPassword">New Password</label>
          <input class="login-form__input" type="password" id="newPassword" name="password"
            autocomplete="new-password" placeholder="At least 8 characters" required minlength="8" />
        </div>

        <div class="login-form__group">
          <label class="login-form__label" for="confirmNewPassword">Confirm New Password</label>
          <input class="login-form__input" type="password" id="confirmNewPassword" name="confirmPassword"
            autocomplete="new-password" placeholder="Re-enter your new password" required />
        </div>

        <p id="resetMessage" class="login-form__message" aria-live="polite"></p>

        <button type="submit" class="login-form__submit">Update Password</button>
      </form>

      <p class="login-form__footer">
        Remember your password? <a href="login.html">Sign In</a>
      </p>

    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
  <script src="config.js"></script>
  <script src="auth.js" defer></script>
  <script src="script.js" defer></script>
</body>

</html>
