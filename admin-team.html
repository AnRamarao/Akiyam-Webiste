<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Team Management – AIKYAM</title>
  <meta name="title" content="Team Management – AIKYAM" />
  <meta name="description" content="Manage AIKYAM team members." />
  <meta name="robots" content="noindex, nofollow" />

  <link rel="icon" type="image/png" href="assets/branding/logo.png" />
  <link rel="apple-touch-icon" href="assets/branding/logo.png" />

  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co;" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="tricolor" aria-hidden="true"></div>

  <div id="bg-zoom" aria-hidden="true">
    <picture>
      <source type="image/webp" srcset="assets/branding/BgImage-1200.webp 1200w, assets/branding/BgImage.webp 1920w">
      <img id="bgZoomImg" src="assets/branding/BgImage.png" alt="AIKYAM community background">
    </picture>
  </div>

  <div id="header-placeholder"></div>

  <main id="main-content" class="admin-page">
    <div class="admin-page__container">

      <div class="admin-page__header">
        <h1 class="admin-page__title">Team Management</h1>
        <button class="btn btn--primary" id="createMemberBtn">+ New Member</button>
      </div>

      <div class="admin-tabs" id="groupTabs">
        <button class="admin-tabs__tab admin-tabs__tab--active" data-group="all">All</button>
        <button class="admin-tabs__tab" data-group="board">Board</button>
        <button class="admin-tabs__tab" data-group="executive">Executive</button>
      </div>

      <div class="admin-list" id="membersList">
        <div class="admin-list__empty">Loading team members...</div>
      </div>

      <!-- Member form modal -->
      <div class="admin-modal" id="memberModal" style="display:none;" role="dialog" aria-modal="true"
        aria-label="Team member form">
        <div class="admin-modal__backdrop" id="modalBackdrop"></div>
        <div class="admin-modal__content">
          <div class="admin-modal__header">
            <h2 class="admin-modal__title" id="modalTitle">Add Member</h2>
            <button class="admin-modal__close" id="modalClose" aria-label="Close">&times;</button>
          </div>

          <form class="admin-form" id="memberForm" novalidate>
            <div class="admin-form__group">
              <label class="admin-form__label" for="memName">Name *</label>
              <input class="admin-form__input" type="text" id="memName" required />
            </div>

            <div class="admin-form__group">
              <label class="admin-form__label" for="memTitle">Title / Role *</label>
              <input class="admin-form__input" type="text" id="memTitle" placeholder="e.g. President, Board of Director" required />
            </div>

            <div class="admin-form__group">
              <label class="admin-form__label" for="memImg">Image Path</label>
              <input class="admin-form__input" type="text" id="memImg" value="assets/branding/logo.png" />
            </div>

            <div class="admin-form__row">
              <div class="admin-form__group">
                <label class="admin-form__label" for="memGroup">Group *</label>
                <select class="admin-form__input" id="memGroup">
                  <option value="executive">Executive Committee</option>
                  <option value="board">Board of Directors</option>
                </select>
              </div>
              <div class="admin-form__group">
                <label class="admin-form__label" for="memYear">Year (executive only)</label>
                <input class="admin-form__input" type="number" id="memYear" min="2020" max="2099" />
              </div>
            </div>

            <div class="admin-form__row">
              <div class="admin-form__group">
                <label class="admin-form__label" for="memOrder">Sort Order</label>
                <input class="admin-form__input" type="number" id="memOrder" value="0" min="0" />
              </div>
              <div class="admin-form__group admin-form__group--inline" style="margin-top:24px;">
                <input type="checkbox" id="memChairman" />
                <label class="admin-form__label" for="memChairman">Chairman</label>
              </div>
            </div>

            <div class="admin-form__group admin-form__group--inline">
              <input type="checkbox" id="memActive" checked />
              <label class="admin-form__label" for="memActive">Active (visible on public site)</label>
            </div>

            <p id="formMessage" class="admin-form__message" aria-live="polite"></p>

            <div class="admin-form__actions">
              <button type="submit" class="btn btn--primary" id="formSubmitBtn">Save</button>
              <button type="button" class="btn btn--secondary" id="formCancelBtn">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
  <script src="config.js"></script>
  <script src="auth.js" defer></script>
  <script src="team.js" defer></script>
  <script src="admin-team.js" defer></script>
  <script src="script.js" defer></script>
</body>

</html>
