<!DOCTYPE html>
<!--
  AIKYAM • Fillout Form Page
  - Embedded Fillout form for submissions
-->
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Submit your details to AIKYAM using our Fillout form. Quick, secure, and easy to complete." />
  <meta name="keywords" content="AIKYAM, form, submission, fillout, registration" />
  <meta name="author" content="AIKYAM" />

  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="AIKYAM - Fillout Form" />
  <meta property="og:description" content="Submit your details to AIKYAM using our Fillout form." />
  <meta property="og:image" content="assets/branding/logo.png" />
  <meta property="og:url" content="https://aikyamusa.org/fillout.html" />

  <!-- Performance optimizations -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="assets/branding/logo.png" type="image/png" />
</head>

<body>
  <div class="tricolor" aria-hidden="true"></div>

  <div id="bg-zoom" aria-hidden="true">
    <img id="bgZoomImg" src="assets/branding/BgImage.png" alt="">
  </div>

  <!-- Header will be loaded by JavaScript -->
  <div id="header-placeholder"></div>

  <!-- ===== Fillout Form ===== -->
  <section id="register" class="reveal" role="region" aria-labelledby="fillout-title">
    <div class="container">
      <h2 id="fillout-title" class="section-title">Submit Your Details</h2>

      <div class="reg-wrap">
        <div class="embed">
          <div class="embed-head">
            <span class="badge">AIKYAM Form</span>
            <div class="embed-actions">
              <span class="hint">Prefer a new tab?</span>
              <a class="btn link" target="_blank" rel="noopener" href="https://forms.fillout.com/t/rw3GjKufwUus">Open
                Fillout Form</a>
            </div>
          </div>
          <div class="embed-body">
            <iframe src="https://forms.fillout.com/t/rw3GjKufwUus" allow="payment *; clipboard-write *;"></iframe>
          </div>
        </div>
      </div>
    </div>
  </section>

  <canvas id="fireworks-canvas"></canvas>
  <div id="toTop" title="Back to top">↑</div>
  <div id="toast"></div>

  <!-- Footer will be loaded by JavaScript -->
  <div id="footer-placeholder"></div>

  <script src="script.js"></script>
</body>

</html>
