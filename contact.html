  <div class="tricolor" aria-hidden="true"></div>

  <div id="bg-zoom" aria-hidden="true">

  </div>

  <!-- Header will be loaded by JavaScript -->
  <div id="header-placeholder"></div>


  <!-- ===== Contact Information ===== -->
  <section id="contact-info" class="reveal">
    <div class="container">
      <h2 class="section-title">Contact Information</h2>
      
      <div class="contact-grid">
        <div class="card contact-card">
          <h3 class="contact-title">📧 Email Us</h3>
          <p class="contact-text">
            <a href="mailto:notify@aikyamusa.org" class="contact-email">notify@aikyamusa.org</a>
          </p>
          <p class="hint">We typically respond within 24-48 hours</p>
        </div>
        
        <div class="card contact-card">
          <h3 class="contact-title">🌐 Follow Us</h3>
          <div class="social-links">
            <a target="_blank" rel="noopener" href="https://www.youtube.com/@ManaAIKYAM" class="btn mini">YouTube</a>
            <a href="#" class="btn mini secondary">Facebook</a>
            <a href="#" class="btn mini secondary">Instagram</a>
            <a href="#" class="btn mini secondary">Twitter</a>
          </div>
          <p class="hint hint-margin">Stay updated on events and community news</p>
        </div>
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>
