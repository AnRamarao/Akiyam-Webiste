<!DOCTYPE html>
<!--
  AIKYAM • Vendors & Partners Page
  - Community partners and vendor listings
-->
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Discover AIKYAM's trusted community partners and vendors. Support local businesses that support our cultural community - food, boutique, education, and services." />
  <meta name="keywords"
    content="AIKYAM, vendors, partners, community business, local businesses, Indian businesses, cultural community partners" />
  <meta name="author" content="AIKYAM" />

  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="AIKYAM Vendors & Partners - Community Business Directory" />
  <meta property="og:description"
    content="Discover AIKYAM's trusted community partners and vendors supporting our cultural community." />
  <meta property="og:image" content="assets/branding/logo.png" />
  <meta property="og:url" content="https://aikyamusa.org/vendors.html" />

  <!-- Performance optimizations -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="assets/branding/logo.png" type="image/png" />
</head>

<body>
  <div class="tricolor" aria-hidden="true"></div>

  <div id="bg-zoom" aria-hidden="true">
    <img id="bgZoomImg" src="assets/branding/BgImage.png" alt="">
  </div>

  <!-- Header will be loaded by JavaScript -->
  <div id="header-placeholder"></div>

  <!-- ===== Vendor Directory ===== -->
  <section id="vendor-directory" class="reveal" aria-labelledby="vendor-directory-title">
    <div class="container">
      <h2 id="vendor-directory-title" class="section-title">Vendor Directory</h2>

      <div class="card margin-bottom-20">
        <div class="vendor-filter-section" role="group" aria-label="Vendor category filters">
          <span class="pill" aria-hidden="true">Filter by Category:</span>
          <!-- Filter buttons will be generated dynamically from JSON data -->
        </div>
        <div id="vendorGrid" role="grid" aria-label="Vendor listings"></div>
      </div>
    </div>
  </section>

  <!-- Footer will be loaded by JavaScript -->
  <div id="footer-placeholder"></div>

  <script src="script.js"></script>
</body>

</html>
